name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: PHP instellen
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax controleren
        run: |
          php -l api/index.php
          php -l api/lib.php
          php -l api/config.sample.php
          node --check app.js
          node --check sw.js

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      # api/config.php staat niet in git en wordt dus nooit overschreven of verwijderd:
      # die maak je één keer zelf op de server aan.
      - name: Upload naar STRATO via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_PATH }}
